name: Controllo Medical Timeout

on:
  schedule:
    # Ogni 5 minuti (GitHub puo' ritardare l'esecuzione di qualche minuto
    # nei momenti di traffico alto, e' un limite del piano gratuito)
    - cron: "*/2 * * * *"
  workflow_dispatch: {}  # permette di far partire il controllo manualmente dal sito

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le librerie necessarie
        run: pip install -r requirements.txt

      - name: Esegui il controllo dei medical timeout
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mto_checker.py

      - name: Salva lo stato aggiornato (eventi gia' notificati)
        run: |
          git config user.name "mto-bot"
          git config user.email "mto-bot@users.noreply.github.com"
          git add sent_incidents.json
          git diff --quiet --cached || git commit -m "Aggiorna stato notifiche"
          git push
