name: Test messaggio Telegram

on:
  workflow_dispatch: {}  # si avvia solo manualmente, mai in automatico

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Invia un messaggio di prova su Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ Test riuscito! Il tuo bot MTO Tennis e' collegato correttamente a Telegram."
            
